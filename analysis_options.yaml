# Lints run with `flutter analyze`; see https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
    - directives_ordering
    - missing_whitespace_between_adjacent_strings
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - unawaited_futures
